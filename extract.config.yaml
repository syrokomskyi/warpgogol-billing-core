forgePlugin: false
# extract.config.yaml — standalone package export for @warpgogol/warpgogol-billing-core

projectDir: packages/warpgogol-billing-core
destName: warpgogol-billing-core
standalone: true

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
preservePackages:
  - "@warpgogol/warpgogol-billing-core"
packageManager: pnpm

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24
  provenance: true

ignoreDirs:
  - .turbo
  - node_modules

excludePathSegments:
  - .npmrc
  - pnpm-lock.yaml
  - tests

postProcess:
  - action: delete
    path: pnpm-lock.yaml

git:
  remote: git@github.com:syrokomskyi/warpgogol-billing-core.git
  autoPush: true
